<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <title>Sheet Assistant</title>
  <script src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script>
  <style>
    body { font-family: Segoe UI, Arial, sans-serif; margin: 12px; }
    textarea { width: 100%; height: 80px; box-sizing: border-box; }
    button { margin-top: 8px; padding: 6px 12px; }
    #out { margin-top: 12px; white-space: pre-wrap; font-size: 13px; }
  </style>
</head>
<body>
  <h3>Sheet Assistant</h3>
  <textarea id="prompt" placeholder="e.g. sum column B from row 2 down"></textarea>
  <button id="run">Run</button>
  <div id="out"></div>
  <script src="taskpane.js"></script>
</body>
</html>
